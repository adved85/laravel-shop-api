opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.save_comments=1

; The image is immutable per release (a new deploy = a new container), so the
; code on disk never changes underneath a running container. Skipping the
; mtime check on every request is safe here and meaningfully faster than the
; default, which is tuned for editing files in place on a live server.
opcache.validate_timestamps=0
