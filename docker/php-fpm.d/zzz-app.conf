; Must sort after the base image's zz-docker.conf, which sets
; `[global] daemonize = no`. Naming this file zz-docker.conf would replace
; that file rather than extend it, php-fpm would daemonize, and PID 1 would
; exit immediately — the container stops with code 0 right after logging
; "ready to handle connections".
[www]
listen = 0.0.0.0:9000

; php-fpm strips the process environment from workers by default. Without
; this, DB_*, REDIS_*, etc. set via `environment:`/`env_file` in compose
; never reach Laravel's env() calls.
clear_env = no
