# .github/workflows/ci.yml

name: Laravel CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  # Lets docker-publish.yml gate a release on this exact pipeline instead of
  # redefining the test steps there, which would let the two drift apart.
  workflow_call:

jobs:
  test:
    name: Test Laravel API

    runs-on: ubuntu-latest

    strategy:
      matrix:
        php-version: [8.4]

    # Tests run against PostgreSQL rather than phpunit.xml's SQLite default so
    # CI matches production. Keep this version in step with the postgres
    # service in the shop-infrastructure compose file.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, bcmath, ctype, fileinfo, gd, intl, openssl, pdo, pdo_pgsql, pgsql, tokenizer, xml
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # Real environment variables take precedence over both the .env file
      # (Laravel loads it immutably) and phpunit.xml's <env> entries, so these
      # override the SQLite defaults without needing to edit either file.
      - name: Run tests
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: testing
          DB_USERNAME: postgres
          DB_PASSWORD: secret
        run: php artisan test

  # Catches Dockerfile breakage on every push rather than at release time,
  # when docker-publish.yml would otherwise be the first thing to build it.
  docker-build:
    name: Build Docker image

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: laravel-shop-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify required PHP extensions are present
        run: |
          docker run --rm --entrypoint php laravel-shop-api:ci -m > extensions.txt
          for ext in gd pdo_pgsql pgsql Zend\ OPcache bcmath pcntl exif zip intl; do
            grep -qi "^${ext}$" extensions.txt || { echo "Missing PHP extension: ${ext}"; exit 1; }
          done
          echo "All required extensions present."

      - name: Verify php-fpm stays in the foreground
        run: |
          docker run -d --name fpm-check -e APP_KEY=base64:$(openssl rand -base64 32) laravel-shop-api:ci
          sleep 5
          status=$(docker inspect fpm-check --format '{{.State.Status}}')
          docker logs fpm-check
          docker rm -f fpm-check
          [ "$status" = "running" ] || { echo "Container exited early (status: ${status})"; exit 1; }
          echo "php-fpm is running in the foreground."
