# .github/workflows/docker-publish.yml
#
# Builds and pushes the API image to GHCR. Deliberately separate from ci.yml
# (fast tests vs. slow image build are different concerns) and triggered by
# version tags rather than every push to main, since the infra repo pins a
# specific ${API_VERSION} tag rather than tracking a floating `latest`.

name: Publish Docker image

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # A tag can point at any commit, so nothing otherwise guarantees a release
  # was tested. Calling ci.yml reuses its exact test and image-verification
  # jobs; the image it builds warms the shared gha layer cache, so the push
  # below reuses those layers rather than rebuilding from scratch.
  verify:
    name: Verify
    uses: ./.github/workflows/ci.yml

  build-and-push:
    name: Build and push image

    needs: verify

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `latest` is added automatically by the default `latest=auto`
          # flavor, which — unlike a raw always-on latest tag — correctly
          # skips pre-releases, so tagging v2.0.0-rc1 will not move `latest`
          # off the current stable release.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
